<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Line Quality — Overview</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a22; --panel2: #1a232d; --line: #243140;
    --ink: #e7eef5; --muted: #8aa0b3; --ok: #34d399;
    --major: #f43f5e; --minor: #f59e0b; --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: baseline; justify-content: space-between;
           padding: 18px 26px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%;
         background: var(--ok); margin-right: 7px; box-shadow: 0 0 8px var(--ok); }
  .wrap { padding: 22px 26px; max-width: 1200px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .big { font-size: 64px; font-weight: 800; line-height: 1; }
  .big.alarm { color: var(--major); animation: pulse 1.1s ease-in-out infinite; }
  .big.clear { color: var(--ok); }
  .label { color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-size: 11px; margin-bottom: 8px; }
  .pillrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .pill { padding: 6px 12px; border-radius: 999px; font-size: 13px; background: var(--panel2); border: 1px solid var(--line); }
  .pill b { font-variant-numeric: tabular-nums; }
  .pill.major { color: var(--major); border-color: #3a1722; }
  .pill.minor { color: var(--minor); border-color: #3a2e15; }
  h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 0 0 12px; }
  .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .defect { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--minor);
            border-radius: 12px; padding: 15px 16px; text-decoration: none; color: inherit; display: block;
            transition: transform .1s ease, border-color .2s; }
  .defect:hover { transform: translateY(-2px); border-color: var(--accent); }
  .defect.major { border-left-color: var(--major); }
  .defect.isnew { animation: flash 1.6s ease-out; }
  .defect .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .defect .part { font-weight: 700; font-size: 16px; }
  .defect .sev { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
                 padding: 3px 8px; border-radius: 6px; }
  .sev.major { background: #3a1722; color: var(--major); }
  .sev.minor { background: #3a2e15; color: var(--minor); }
  .defect .what { color: var(--ink); margin: 2px 0 8px; }
  .defect .meta { color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .defect .arrow { color: var(--accent); font-size: 12px; margin-top: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  @keyframes flash { 0% { background: #2a1622; } 100% { background: var(--panel); } }
</style>
</head>
<body>
  <header>
    <div>
      <h1>Line Quality — Overview</h1>
      <div class="sub">Caffeinated Robots · production line</div>
    </div>
    <div class="sub"><span class="dot" id="livedot"></span><span id="status">connecting…</span></div>
  </header>

  <div class="wrap">
    <div class="stats">
      <div class="card">
        <div class="label">Faulty parts on the line</div>
        <div class="big clear" id="count">0</div>
      </div>
      <div class="card">
        <div class="label">By severity</div>
        <div class="pillrow" id="sev"></div>
      </div>
      <div class="card">
        <div class="label">By station</div>
        <div class="pillrow" id="stations"></div>
      </div>
    </div>

    <h2>Live defect feed</h2>
    <div class="feed" id="feed"></div>
    <div class="empty" id="empty" hidden>No faulty parts — line is clear. ✅</div>
  </div>

<script>
const POLL_MS = {{ poll_ms }};
const seen = new Set();
let first = true;

function fmtTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function tick() {
  try {
    const r = await fetch("/api/defects");
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    const data = await r.json();
    render(data);
    setStatus(true, "live · " + new Date().toLocaleTimeString());
  } catch (e) {
    setStatus(false, "error: " + e.message);
  }
}

function setStatus(ok, msg) {
  document.getElementById("status").textContent = msg;
  document.getElementById("livedot").style.background = ok ? "var(--ok)" : "var(--major)";
  document.getElementById("livedot").style.boxShadow = "0 0 8px " + (ok ? "var(--ok)" : "var(--major)");
}

function render(data) {
  const count = data.count;
  const el = document.getElementById("count");
  el.textContent = count;
  el.className = "big " + (count > 0 ? "alarm" : "clear");

  // severity + station rollups
  const sev = { major: 0, minor: 0, other: 0 }, st = {};
  for (const d of data.defects) {
    const s = (d.severity || "other").toLowerCase();
    sev[s === "major" || s === "minor" ? s : "other"]++;
    const name = d.station_name || "unknown";
    st[name] = (st[name] || 0) + 1;
  }
  document.getElementById("sev").innerHTML =
    `<span class="pill major">major <b>${sev.major}</b></span>` +
    `<span class="pill minor">minor <b>${sev.minor}</b></span>` +
    `<span class="pill">other <b>${sev.other}</b></span>`;
  document.getElementById("stations").innerHTML =
    Object.keys(st).length
      ? Object.entries(st).map(([n, c]) => `<span class="pill">${n} <b>${c}</b></span>`).join("")
      : `<span class="pill">— none —</span>`;

  const feed = document.getElementById("feed");
  document.getElementById("empty").hidden = count > 0;
  feed.innerHTML = "";
  for (const d of data.defects) {
    const sevClass = (d.severity || "").toLowerCase() === "major" ? "major" : "minor";
    const isNew = !first && !seen.has(d.product_id);
    seen.add(d.product_id);
    const a = document.createElement("a");
    a.href = "/operator?product_id=" + d.product_id;
    a.className = "defect " + sevClass + (isNew ? " isnew" : "");
    a.innerHTML =
      `<div class="top">
         <span class="part">${d.label || "Part #" + d.product_id}</span>
         <span class="sev ${sevClass}">${d.severity || d.product_status}</span>
       </div>
       <div class="what">${d.defect}</div>
       <div class="meta">
         <span>📍 ${d.station_name || "?"} (pos ${d.station_position ?? "?"})</span>
         <span>status: ${d.product_status}</span>
         <span>🕗 ${fmtTime(d.detected_at)}</span>
       </div>
       <div class="arrow">Open repair instructions →</div>`;
    feed.appendChild(a);
  }
  first = false;
}

tick();
setInterval(tick, POLL_MS);
</script>
</body>
</html>
